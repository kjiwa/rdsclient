name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt

      - name: Check formatting (shfmt)
        run: shfmt -i 2 -d .

      - name: Run test suite (shellcheck, drift check, unit, e2e)
        run: ./tests/run.sh

      - name: Lint workflows (zizmor)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pipx run zizmor==1.30.1 .github/workflows/

  privacy:
    uses: kjiwa/.github/.github/workflows/privacy.yml@main
